<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台登录</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script defer src="/js/main.js"></script>
  </head>
  <body data-page="admin-login">
    <main class="page-shell login-shell">
      <section class="panel login-panel">
        <div class="page-heading">
          <p class="eyebrow">后台管理</p>
          <h1>管理员登录</h1>
        </div>

        <form id="loginForm" class="stack-form">
          <label>
            <span>账号</span>
            <input
              type="text"
              name="username"
              autocomplete="username"
              required
            />
          </label>

          <label>
            <span>密码</span>
            <input
              type="password"
              name="password"
              autocomplete="current-password"
              required
            />
          </label>

          <div id="loginMessage" class="message" role="status"></div>

          <div class="actions">
            <button type="submit" class="primary-button">登录</button>
            <a class="text-link" href="/submit">返回提交页</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
